name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library — build, unit tests, pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:lib
      - run: npm run test:lib
      - run: cd dist/angular-convex && npm pack --pack-destination ../../compat
      - uses: actions/upload-artifact@v4
        with: { name: tarball, path: compat/angular-convex-*.tgz }

  e2e:
    name: Demo e2e (local Convex backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # The optional secrets turn on the full GitHub OAuth round trip (see the
      # README); without them it is skipped and placeholders are used.
      - run: scripts/ci-backend.sh
        env:
          AUTH_GITHUB_CLIENT_ID: ${{ secrets.E2E_GITHUB_OAUTH_CLIENT_ID }}
          AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.E2E_GITHUB_OAUTH_CLIENT_SECRET }}
      - run: npm run build:lib
      - run: npx playwright test --grep-invert @secrets
      # The test account's passkey must not land in a trace or the HTML
      # report, which are uploaded publicly: run it apart, list reporter only.
      - run: npx playwright test --grep @secrets --reporter=list
        env:
          E2E_GITHUB_PASSKEY_ID: ${{ secrets.E2E_GITHUB_PASSKEY_ID }}
          E2E_GITHUB_PASSKEY_KEY: ${{ secrets.E2E_GITHUB_PASSKEY_KEY }}
          E2E_GITHUB_PASSKEY_USER: ${{ secrets.E2E_GITHUB_PASSKEY_USER }}
      - name: Dashboard features from the CLI
        run: scripts/dashboard-cli.sh | tee dashboard-cli.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            e2e/screenshots
            e2e/report
            convex-dev.log
            dashboard-cli.txt

  compat:
    name: Angular ${{ matrix.angular }} · Node ${{ matrix.node }}
    needs: library
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { angular: 17, node: 20, convex: 1.48.0 }
          - { angular: 18, node: 20, convex: 1.48.0 }
          - { angular: 19, node: 20, convex: 1.48.0 }
          - { angular: 20, node: 20, convex: 1.48.0 }
          - { angular: 21, node: 20, convex: 1.48.0 }
          - { angular: 21, node: 24, convex: 1.50.0 }
          - { angular: 22, node: 22, convex: 1.50.0 }
          - { angular: 22, node: 24, convex: 1.50.0 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: tarball, path: compat }
      # Build the row's app with the row's Node…
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: compat/run.sh ${{ matrix.angular }}:${{ matrix.node }}:${{ matrix.convex }}
        env: { COMPAT_APPS: '${{ runner.temp }}/compat' }
      # …then run it against the backend, which the workspace runs on Node 22.
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: scripts/ci-backend.sh
      - run: npm run compat:e2e
        env: { COMPAT_APPS: '${{ runner.temp }}/compat' }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-ng${{ matrix.angular }}-node${{ matrix.node }}
          path: |
            compat/RESULTS.md
            compat/screenshots
            ${{ runner.temp }}/compat/*.log
